<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resource Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 650px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    input[type="number"] {
      width: 80%;
      padding: 5px;
      text-align: center;
    }
    .calculated {
      background-color: #fafafa;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Resource Tracking Table</h2>

  <table>
    <thead>
      <tr>
        <th>Amount Have</th>
        <th>Amount Needed</th>
        <th>Amount Left Needed</th>
      </tr>
    </thead>
    <tbody>
      <!-- Row 1 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td><input type="number" value="0" class="needed-input" oninput="calculate()"></td>
        <td class="left-needed">0</td>
      </tr>
      <!-- Row 2 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td>
          <span class="needed-calc">0</span> 
          + <input type="number" value="0" class="needed-input" style="width: 45%;" oninput="calculate()">
        </td>
        <td class="left-needed">0</td>
      </tr>
      <!-- Row 3 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td>
          <span class="needed-calc">0</span> 
          + <input type="number" value="0" class="needed-input" style="width: 45%;" oninput="calculate()">
        </td>
        <td class="left-needed">0</td>
      </tr>
      <!-- Row 4 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td>
          <span class="needed-calc">0</span> 
          + <input type="number" value="0" class="needed-input" style="width: 45%;" oninput="calculate()">
        </td>
        <td class="left-needed">0</td>
      </tr>
    </tbody>
  </table>

  <script>
    function calculate() {
      const rows = document.querySelectorAll('tbody tr');
      let prevLeftNeeded = 0;

      rows.forEach((row, index) => {
        const haveInput = row.querySelector('.have');
        const neededInput = row.querySelector('.needed-input');
        const leftNeededCell = row.querySelector('.left-needed');

        const amountHave = parseFloat(haveInput.value) || 0;
        const userInput = parseFloat(neededInput.value) || 0;

        let totalAmountNeeded = 0;

        if (index === 0) {
          // Row 1: Directly equal to user input
          totalAmountNeeded = userInput;
        } else {
          // Rows 2-4: Formula = ((Prev Left Needed - Amount Have) * 3) + User Input
          const baseCalculated = (prevLeftNeeded - amountHave) * 3;
          
          // Display the formula part inside the cell next to the input field
          row.querySelector('.needed-calc').textContent = baseCalculated;
          
          totalAmountNeeded = baseCalculated + userInput;
        }

        // Left Needed = Amount Needed - Amount Have
        const leftNeeded = totalAmountNeeded - amountHave;
        leftNeededCell.textContent = leftNeeded;

        // Carry forward to the next row calculation
        prevLeftNeeded = leftNeeded;
      });
    }

    // Run calculation once on page load
    calculate();
  </script>

</body>
</html>
