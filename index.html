<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Tracker for Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f9ff;
      --card-bg: #ffffff;
      --primary-pink: #ff6b8b;
      --primary-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-yellow: #facc15;
      --text-dark: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --font-fun: 'Fredoka', cursive, sans-serif;
      --font-body: 'Quicksand', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 107, 139, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Styling */
    .header {
      max-width: 100%;
      margin: 0 auto 24px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 16px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.08);
    }

    .title-area h1 {
      font-family: var(--font-fun);
      font-size: 1.8rem;
      color: var(--primary-purple);
      letter-spacing: 0.5px;
    }

    .title-area p {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Toggle Switch */
    .toggle-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-fun);
      color: var(--text-dark);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: 0.3s;
      border-radius: 30px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    input:checked + .slider {
      background-color: var(--primary-pink);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Add Matrix Button */
    .btn-add {
      font-family: var(--font-fun);
      font-size: 1rem;
      color: white;
      background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
      border: none;
      border-radius: 30px;
      padding: 10px 24px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.4);
      transition: all 0.2s ease;
    }

    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 139, 0.6);
    }

    /* Grid System: 5 tables per row on 1080p display */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    @media (max-width: 1600px) {
      .tables-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 1280px) {
      .tables-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .tables-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .tables-grid { grid-template-columns: 1fr; }
    }

    /* Bright Table Card */
    .table-card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
      border: 2px solid #f1f5f9;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s;
    }

    .table-card:hover {
      transform: translateY(-4px);
      border-color: #e2e8f0;
    }

    /* Card Header */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf5ff;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .card-title-input {
      font-family: var(--font-fun);
      font-size: 1.05rem;
      color: var(--primary-purple);
      background: transparent;
      border: none;
      outline: none;
      width: 85%;
    }

    .btn-delete {
      background: #ffe4e6;
      border: none;
      color: #f43f5e;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete:hover {
      background: #f43f5e;
      color: white;
    }

    /* Table Structure */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      font-family: var(--font-fun);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      padding-bottom: 8px;
      text-align: center;
    }

    td {
      padding: 6px 2px;
      text-align: center;
      vertical-align: middle;
    }

    /* Inputs & Badges */
    input[type="number"] {
      font-family: var(--font-fun);
      font-size: 0.95rem;
      color: var(--text-dark);
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 4px;
      width: 100%;
      max-width: 50px;
      text-align: center;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--primary-pink);
      background: white;
    }

    .needed-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .needed-total {
      font-family: var(--font-fun);
      font-size: 0.95rem;
      color: var(--primary-purple);
    }

    .sub-input {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .sub-input input {
      max-width: 40px;
      padding: 2px;
      font-size: 0.8rem;
    }

    .left-needed-badge {
      font-family: var(--font-fun);
      font-size: 0.95rem;
      color: #0284c7;
      background: #e0f2fe;
      padding: 4px 8px;
      border-radius: 10px;
      display: inline-block;
      width: 85%;
      word-break: break-all;
    }

    /* Debug Box */
    .debug-col {
      display: none;
    }

    body.show-debug .debug-col {
      display: table-cell;
    }

    .debug-box {
      font-family: monospace;
      font-size: 0.65rem;
      line-height: 1.2;
      color: #475569;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 4px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <h1>⭐ Resource Tracker</h1>
      <p>Calculate everything you need easily!</p>
    </div>
    <div class="controls">
      <label class="toggle-group">
        <span>Debug View</span>
        <div class="switch">
          <input type="checkbox" id="debugToggle" onchange="toggleDebugView()">
          <span class="slider"></span>
        </div>
      </label>
      <button class="btn-add" onclick="addTable()">+ Add Table</button>
    </div>
  </div>

  <div class="tables-grid" id="tablesContainer">
    <!-- Dynamic tables will spawn here -->
  </div>

  <script>
    let tableCounter = 0;

    function toggleDebugView() {
      const isChecked = document.getElementById('debugToggle').checked;
      if (isChecked) {
        document.body.classList.add('show-debug');
      } else {
        document.body.classList.remove('show-debug');
      }
    }

    function createTableHTML(id, defaultName) {
      return `
        <div class="table-card" id="card-${id}">
          <div class="card-header">
            <input type="text" class="card-title-input" value="${defaultName}" placeholder="Item Name...">
            <button class="btn-delete" title="Remove Table" onclick="removeTable(${id})">✕</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Have</th>
                <th>Needed</th>
                <th>Left</th>
                <th class="debug-col">Logic</th>
              </tr>
            </thead>
            <tbody>
              ${[1, 2, 3, 4].map((row, idx) => `
                <tr>
                  <td>
                    <input type="number" value="0" class="have" oninput="calculateCard(${id})">
                  </td>
                  <td>
                    <div class="needed-wrapper">
                      ${idx === 0 
                        ? `<input type="number" value="0" class="needed-input" oninput="calculateCard(${id})">`
                        : `<span class="needed-total">0</span>
                           <div class="sub-input">
                             <span>+</span>
                             <input type="number" value="0" class="needed-input" oninput="calculateCard(${id})">
                           </div>`
                      }
                    </div>
                  </td>
                  <td>
                    <span class="left-needed-badge left-needed">0</span>
                  </td>
                  <td class="debug-col">
                    <div class="debug-box debug"></div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function addTable(customName) {
      tableCounter++;
      const name = customName || `Table #${tableCounter}`;
      const container = document.getElementById('tablesContainer');
      
      const wrapper = document.createElement('div');
      wrapper.innerHTML = createTableHTML(tableCounter, name);
      const cardElement = wrapper.firstElementChild;
      
      container.appendChild(cardElement);
      calculateCard(tableCounter);
    }

    function removeTable(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) card.remove();
    }

    function calculateCard(id) {
      const card = document.getElementById(`card-${id}`);
      if (!card) return;

      const rows = card.querySelectorAll('tbody tr');
      let prevLeftNeeded = 0;

      rows.forEach((row, index) => {
        const haveInput = row.querySelector('.have');
        const neededInput = row.querySelector('.needed-input');
        const leftNeededCell = row.querySelector('.left-needed');
        const debugCell = row.querySelector('.debug');

        const amountHave = haveInput.value === '' ? 0 : parseFloat(haveInput.value);
        const userInput = neededInput.value === '' ? 0 : parseFloat(neededInput.value);

        let totalAmountNeeded = 0;
        let debugText = "";

        if (index === 0) {
          totalAmountNeeded = userInput;
          debugText = `Needed = Input (${userInput})`;
        } else {
          totalAmountNeeded = (prevLeftNeeded * 3) + userInput;
          row.querySelector('.needed-total').textContent = totalAmountNeeded;
          debugText = `Needed = (${prevLeftNeeded} × 3) + (${userInput}) = ${totalAmountNeeded}`;
        }

        const leftNeeded = totalAmountNeeded - amountHave;
        leftNeededCell.textContent = leftNeeded;

        debugText += `\nLeft = ${totalAmountNeeded} - (${amountHave}) = ${leftNeeded}`;
        debugCell.textContent = debugText;

        prevLeftNeeded = leftNeeded;
      });
    }

    // Default 5 tables to fill one full row on 1080p
    addTable("Wood Blocks");
    addTable("Iron Ores");
    addTable("Gold Coins");
    addTable("Magic Crystals");
    addTable("Energy Gems");
  </script>

</body>
</html>
