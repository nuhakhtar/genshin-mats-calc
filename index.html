<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resource Tracker with Debugging Logic</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    input[type="number"] {
      width: 70px;
      padding: 4px;
      text-align: center;
    }
    .debug {
      font-family: monospace;
      font-size: 0.85em;
      color: #555;
      text-align: left;
      background-color: #f9f9f9;
    }
    .total-needed {
      font-weight: bold;
      color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Resource Tracker (Supports Negative Values)</h2>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">1st Col: Amount Have</th>
        <th style="width: 25%;">2nd Col: Amount Needed</th>
        <th style="width: 15%;">3rd Col: Amount Left Needed</th>
        <th style="width: 45%;">Calculation Logic (Debug)</th>
      </tr>
    </thead>
    <tbody>
      <!-- Row 1 -->
      <tr>
        <td><input type="number" value="-5" class="have" oninput="calculate()"></td>
        <td><input type="number" value="10" class="needed-input" oninput="calculate()"></td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
      <!-- Row 2 -->
      <tr>
        <td><input type="number" value="-2" class="have" oninput="calculate()"></td>
        <td>
          <span class="total-needed">0</span>
          <br><small>(+ Extra Input: <input type="number" value="5" class="needed-input" oninput="calculate()">)</small>
        </td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
      <!-- Row 3 -->
      <tr>
        <td><input type="number" value="4" class="have" oninput="calculate()"></td>
        <td>
          <span class="total-needed">0</span>
          <br><small>(+ Extra Input: <input type="number" value="-3" class="needed-input" oninput="calculate()">)</small>
        </td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
      <!-- Row 4 -->
      <tr>
        <td><input type="number" value="-10" class="have" oninput="calculate()"></td>
        <td>
          <span class="total-needed">0</span>
          <br><small>(+ Extra Input: <input type="number" value="2" class="needed-input" oninput="calculate()">)</small>
        </td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
    </tbody>
  </table>

  <script>
    function calculate() {
      const rows = document.querySelectorAll('tbody tr');
      let prevLeftNeeded = 0;

      rows.forEach((row, index) => {
        const haveInput = row.querySelector('.have');
        const neededInput = row.querySelector('.needed-input');
        const leftNeededCell = row.querySelector('.left-needed');
        const debugCell = row.querySelector('.debug');

        // Parse inputs directly without clamping to 0 (supports negatives)
        const amountHave = haveInput.value === '' ? 0 : parseFloat(haveInput.value);
        const userInput = neededInput.value === '' ? 0 : parseFloat(neededInput.value);

        let totalAmountNeeded = 0;
        let debugText = "";

        if (index === 0) {
          // Row 1 formula
          totalAmountNeeded = userInput;
          debugText = `Row 1 Needed = User Input (${userInput})`;
        } else {
          // Rows 2-4 formula: ((Prev Left Needed - Amount Have) * 3) + User Input
          const calcBase = (prevLeftNeeded - amountHave) * 3;
          totalAmountNeeded = calcBase + userInput;

          // Display total amount needed in 2nd column label
          row.querySelector('.total-needed').textContent = totalAmountNeeded;

          debugText = `Needed = ((${prevLeftNeeded} - (${amountHave})) * 3) + (${userInput})\n` +
                      `Needed = ((${prevLeftNeeded - amountHave}) * 3) + (${userInput}) = ${totalAmountNeeded}`;
        }

        // 3rd Col Formula: Left Needed = 2nd Col - 1st Col
        const leftNeeded = totalAmountNeeded - amountHave;
        leftNeededCell.textContent = leftNeeded;

        debugText += `\nLeft Needed = ${totalAmountNeeded} - (${amountHave}) = ${leftNeeded}`;
        
        // Output debug log into the table row
        debugCell.innerText = debugText;

        // Carry forward exact signed value to next row
        prevLeftNeeded = leftNeeded;
      });
    }

    // Run initial calculation
    calculate();
  </script>

</body>
</html>
