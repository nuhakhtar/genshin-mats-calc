<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Resource Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --genshin-bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-border: #475569;
      --gold-primary: #f59e0b;
      --gold-bright: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.4);
      --cyan-accent: #06b6d4;
      --cyan-bright: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #090d16;
      --input-border: #334155;
      --radius: 8px;
      --font-title: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--genshin-bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 100%, rgba(251, 191, 36, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar Header */
    .dashboard-header {
      max-width: 100%;
      margin: 0 auto 24px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 2px solid rgba(251, 191, 36, 0.3);
    }

    .title-area h1 {
      font-family: var(--font-title);
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      color: var(--gold-bright);
      text-transform: uppercase;
      text-shadow: 0 0 16px var(--gold-glow);
    }

    .title-area p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Debug Toggle Switch */
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-title);
      font-size: 0.8rem;
      color: var(--cyan-bright);
      cursor: pointer;
      user-select: none;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #1e293b;
      border: 1px solid var(--card-border);
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: rgba(6, 182, 212, 0.3);
      border-color: var(--cyan-bright);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: var(--cyan-bright);
    }

    /* Genshin Styled Button */
    .btn-genshin {
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 700;
      color: #0f172a;
      background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%);
      border: 1px solid #fef08a;
      border-radius: 20px;
      padding: 10px 24px;
      cursor: pointer;
      box-shadow: 0 0 14px var(--gold-glow);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .btn-genshin:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.7);
    }

    /* Grid Layout: Exactly 5 tables per row on 1920px screens */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    /* Responsive adjustments for smaller screens */
    @media (max-width: 1600px) {
      .tables-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 1280px) {
      .tables-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .tables-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .tables-grid { grid-template-columns: 1fr; }
    }

    /* Card Styling */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .table-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    }

    /* Card Header */
    .card-header {
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-input {
      font-family: var(--font-title);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-bright);
      background: transparent;
      border: none;
      border-bottom: 1px dashed transparent;
      outline: none;
      width: 80%;
      transition: border-color 0.2s;
    }

    .card-title-input:focus, .card-title-input:hover {
      border-bottom-color: var(--gold-bright);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px 6px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: #ef4444;
    }

    /* Table Design */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      font-family: var(--font-title);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      text-transform: uppercase;
      background: rgba(15, 23, 42, 0.4);
      padding: 8px 4px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
    }

    td {
      padding: 8px 4px;
      border-bottom: 1px solid rgba(71, 85, 105, 0.4);
      text-align: center;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Inputs & Form Elements */
    input[type="number"] {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      padding: 4px 2px;
      width: 100%;
      max-width: 55px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="number"]:focus {
      border-color: var(--cyan-bright);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .needed-cell-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .needed-total {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
    }

    .sub-input {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .sub-input input {
      max-width: 45px;
      padding: 2px;
      font-size: 0.75rem;
    }

    /* Dynamic Left Needed Badge */
    .left-needed {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan-bright);
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(34, 211, 238, 0.4);
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
      width: 90%;
      word-break: break-all;
    }

    /* Debug Log Styling */
    .debug-col {
      display: none;
    }

    body.show-debug .debug-col {
      display: table-cell;
    }

    .debug-box {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      line-height: 1.3;
      color: #cbd5e1;
      background: rgba(9, 13, 22, 0.8);
      border: 1px solid rgba(71, 85, 105, 0.5);
      border-radius: 4px;
      padding: 4px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div class="title-area">
      <h1>Resource Optimization Matrix</h1>
      <p>Multi-Domain Material & Talent Progression Planner</p>
    </div>
    <div class="header-controls">
      <label class="toggle-container">
        <span>Debug View</span>
        <div class="switch">
          <input type="checkbox" id="debugToggle" onchange="toggleDebugView()">
          <span class="slider"></span>
        </div>
      </label>
      <button class="btn-genshin" onclick="addTable()">+ Add Matrix</button>
    </div>
  </div>

  <div class="tables-grid" id="tablesContainer">
    <!-- Dynamic tables spawn here -->
  </div>

  <script>
    let tableCounter = 0;

    function toggleDebugView() {
      const isChecked = document.getElementById('debugToggle').checked;
      if (isChecked) {
        document.body.classList.add('show-debug');
      } else {
        document.body.classList.remove('show-debug');
      }
    }

    function createTableHTML(id, defaultName) {
      return `
        <div class="table-card" id="card-${id}">
          <div class="card-header">
            <input type="text" class="card-title-input" value="${defaultName}" placeholder="Domain Name...">
            <button class="btn-delete" title="Remove Matrix" onclick="removeTable(${id})">✕</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Have</th>
                <th>Needed</th>
                <th>Left</th>
                <th class="debug-col">Debug Logic</th>
              </tr>
            </thead>
            <tbody>
              ${[1, 2, 3, 4].map((row, idx) => `
                <tr>
                  <td>
                    <input type="number" value="0" class="have" oninput="calculateCard(${id})">
                  </td>
                  <td>
                    <div class="needed-cell-wrapper">
                      ${idx === 0 
                        ? `<input type="number" value="0" class="needed-input" oninput="calculateCard(${id})">`
                        : `<span class="needed-total">0</span>
                           <div class="sub-input">
                             <span>+</span>
                             <input type="number" value="0" class="needed-input" oninput="calculateCard(${id})">
                           </div>`
                      }
                    </div>
                  </td>
                  <td>
                    <span class="left-needed">0</span>
                  </td>
                  <td class="debug-col">
                    <div class="debug-box debug"></div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function addTable(customName) {
      tableCounter++;
      const name = customName || `Matrix #${tableCounter}`;
      const container = document.getElementById('tablesContainer');
      
      const wrapper = document.createElement('div');
      wrapper.innerHTML = createTableHTML(tableCounter, name);
      const cardElement = wrapper.firstElementChild;
      
      container.appendChild(cardElement);
      calculateCard(tableCounter);
    }

    function removeTable(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) card.remove();
    }

    function calculateCard(id) {
      const card = document.getElementById(`card-${id}`);
      if (!card) return;

      const rows = card.querySelectorAll('tbody tr');
      let prevLeftNeeded = 0;

      rows.forEach((row, index) => {
        const haveInput = row.querySelector('.have');
        const neededInput = row.querySelector('.needed-input');
        const leftNeededCell = row.querySelector('.left-needed');
        const debugCell = row.querySelector('.debug');

        const amountHave = haveInput.value === '' ? 0 : parseFloat(haveInput.value);
        const userInput = neededInput.value === '' ? 0 : parseFloat(neededInput.value);

        let totalAmountNeeded = 0;
        let debugText = "";

        if (index === 0) {
          totalAmountNeeded = userInput;
          debugText = `Needed = Input (${userInput})`;
        } else {
          totalAmountNeeded = (prevLeftNeeded * 3) + userInput;
          row.querySelector('.needed-total').textContent = totalAmountNeeded;
          debugText = `Needed = (${prevLeftNeeded} × 3) + (${userInput}) = ${totalAmountNeeded}`;
        }

        const leftNeeded = totalAmountNeeded - amountHave;
        leftNeededCell.textContent = leftNeeded;

        debugText += `\nLeft = ${totalAmountNeeded} - (${amountHave}) = ${leftNeeded}`;
        debugCell.textContent = debugText;

        prevLeftNeeded = leftNeeded;
      });
    }

    // Initialize with 5 tables on load to showcase 1 full row on 1080p screens
    addTable("Char Talent T1");
    addTable("Char Talent T2");
    addTable("Weapon Asc T1");
    addTable("Weapon Asc T2");
    addTable("Artifact EXP");
  </script>

</body>
</html>
