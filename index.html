<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f0f7ff;
      --card-bg: #ffffff;
      --sky-blue: #0284c7;
      --sky-light: #e0f2fe;
      --sky-border: #bae6fd;
      --gold-accent: #d97706;
      --gold-light: #fef3c7;
      --gold-border: #fcd34d;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation Header */
    .header {
      max-width: 100%;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      border-top: 3px solid var(--gold-accent);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.04);
    }

    .title-area h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--sky-blue);
      letter-spacing: -0.01em;
    }

    .title-area h1 span { color: var(--gold-accent); }

    .title-area p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .id-input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--sky-light);
      border: 1px solid var(--sky-border);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .id-input-wrapper label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #0369a1;
      text-transform: uppercase;
    }

    .id-input {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      background: #ffffff;
      border: 1px solid var(--sky-border);
      border-radius: 6px;
      padding: 4px 8px;
      width: 110px;
      outline: none;
    }

    .id-input:focus {
      border-color: var(--gold-accent);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
    }

    .material-filter-wrapper input {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--text-main);
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      width: 160px;
      outline: none;
    }

    .material-filter-wrapper input:focus {
      border-color: var(--sky-blue);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .sync-status {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Buttons */
    .btn-action {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
      background-color: var(--sky-blue);
      border: 1px solid var(--sky-blue);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.2);
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background-color: #0369a1;
      transform: translateY(-1px);
    }

    .btn-save {
      background-color: var(--gold-accent);
      border-color: var(--gold-border);
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);
    }

    .btn-save:hover { background-color: #b45309; }

    /* Group Filter Tabs */
    .group-tabs-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .group-tab {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .group-tab:hover {
      border-color: var(--sky-border);
      color: var(--sky-blue);
    }

    .group-tab.active {
      background: var(--sky-blue);
      color: #ffffff;
      border-color: var(--sky-blue);
    }

    /* Grid Layout: 5 tables per row on 1080p */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
    }

    @media (max-width: 1600px) { .tables-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1280px) { .tables-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) { .tables-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .tables-grid { grid-template-columns: 1fr; } }

    /* Card Styling */
    .table-card {
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      border: 1px solid var(--border-color);
      border-top: 2px solid var(--gold-border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .table-card.hidden { display: none !important; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--sky-light);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--sky-border);
    }

    .card-title-input {
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      color: #0369a1;
      background: transparent;
      border: none;
      outline: none;
      width: 85%;
    }

    .card-group-tag {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--gold-accent);
      background: var(--gold-light);
      border: 1px solid var(--gold-border);
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      line-height: 1;
    }

    .btn-delete:hover {
      background: #ef4444;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      padding-bottom: 6px;
      text-align: center;
    }

    td {
      padding: 6px 2px;
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
    }

    tr:last-child td { border-bottom: none; }

    input[type="number"] {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px;
      width: 100%;
      max-width: 52px;
      text-align: center;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--gold-accent);
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
    }

    .needed-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .needed-total {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .sub-input {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .sub-input input {
      max-width: 42px;
      padding: 2px;
      font-size: 0.75rem;
    }

    .left-needed-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: #0369a1;
      background: var(--sky-light);
      border: 1px solid var(--sky-border);
      padding: 4px 6px;
      border-radius: 6px;
      display: inline-block;
      width: 88%;
      word-break: break-all;
    }

    .debug-col { display: none; }
    body.show-debug .debug-col { display: table-cell; }

    .debug-box {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      line-height: 1.35;
      color: #475569;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 6px;
      text-align: left;
      white-space: pre-wrap;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      border-top: 3px solid var(--sky-blue);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .modal h3 {
      font-size: 1.1rem;
      color: var(--sky-blue);
      margin-bottom: 12px;
    }

    .modal select, .modal input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.9rem;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 16px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <h1>Resource <span>Tracker</span></h1>
      <p>Group-First Material Aggregator</p>
    </div>
    <div class="controls">
      <span class="sync-status" id="syncStatus">Ready</span>
      
      <div class="id-input-wrapper">
        <label for="profileIdInput">Profile ID:</label>
        <input type="text" id="profileIdInput" class="id-input" placeholder="Enter ID...">
      </div>
      <button class="btn-action" onclick="loadActiveProfile()">Load Profile</button>

      <div class="material-filter-wrapper">
        <input type="text" id="materialFilterInput" placeholder="Filter Material..." oninput="filterTables()">
      </div>

      <button class="btn-action btn-save" onclick="saveToCloud()">Save to Cloud</button>
      <button class="btn-action" onclick="openAddGroupModal()">+ Add Group</button>
      <button class="btn-action" onclick="openAddTableModal()">+ Add Table</button>
    </div>
  </div>

  <div class="group-tabs-bar" id="groupTabsContainer">
    <button class="group-tab active" onclick="switchGroupTab('ALL')">All Materials</button>
  </div>

  <div class="tables-grid" id="tablesContainer"></div>

  <!-- Add Table Modal -->
  <div class="modal-overlay" id="addTableModal">
    <div class="modal">
      <h3>Add Table to Group</h3>
      <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">SELECT GROUP:</label>
      <select id="modalGroupSelect"></select>
      <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">MATERIAL NAME:</label>
      <input type="text" id="modalMaterialInput" placeholder="e.g. Slime Condensate">
      <div class="modal-actions">
        <button class="btn-action" style="background: #64748b; border-color: #64748b;" onclick="closeModal('addTableModal')">Cancel</button>
        <button class="btn-action" onclick="confirmAddTable()">Create Table</button>
      </div>
    </div>
  </div>

  <script>
    const MASTER_BIN_ID = '6a82a4c5da38895dfeeda0a4'; // Replace with Master JSONBin ID
    const API_KEY = '$2a$10$EUDuaRGXs5.vJOxYQg3JOeLrbQxtCkfj7O35Vl.0Lj46HEvKY9FDW';           // Replace with Master Key
    const BASE_URL = `https://api.jsonbin.io/v3/b/${MASTER_BIN_ID}`;

    let tableCounter = 0;
    let registeredGroups = new Set(["General"]);
    let activeGroupTab = "ALL";

    function createTableHTML(id, materialName, groupName) {
      return `
        <div class="table-card" id="card-${id}" data-material="${materialName.toLowerCase()}" data-group="${groupName}">
          <div class="card-header">
            <input type="text" class="card-title-input" value="${materialName}" placeholder="Material Name..." oninput="onMaterialNameChange(${id})">
            <button class="btn-delete" title="Remove Table" onclick="removeTable(${id})">✕</button>
          </div>
          <span class="card-group-tag">${groupName}</span>
          <table>
            <thead>
              <tr>
                <th>Have</th>
                <th>Needed</th>
                <th>Left</th>
              </tr>
            </thead>
            <tbody>
              ${[1, 2, 3, 4].map((row, idx) => `
                <tr>
                  <td>
                    <input type="number" value="0" class="have" oninput="recalculateAllSameMaterials('${materialName.toLowerCase()}')">
                  </td>
                  <td>
                    <div class="needed-wrapper">
                      ${idx === 0 
                        ? `<input type="number" value="0" class="needed-input" oninput="recalculateAllSameMaterials('${materialName.toLowerCase()}')">`
                        : `<span class="needed-total">0</span>
                           <div class="sub-input">
                             <span>+</span>
                             <input type="number" value="0" class="needed-input" oninput="recalculateAllSameMaterials('${materialName.toLowerCase()}')">
                           </div>`
                      }
                    </div>
                  </td>
                  <td>
                    <span class="left-needed-badge left-needed">0</span>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function addTable(materialName, groupName) {
      tableCounter++;
      const name = materialName || `Material #${tableCounter}`;
      const group = groupName || "General";
      
      registeredGroups.add(group);
      renderGroupTabs();

      const container = document.getElementById('tablesContainer');
      const wrapper = document.createElement('div');
      wrapper.innerHTML = createTableHTML(tableCounter, name, group);
      const cardElement = wrapper.firstElementChild;
      
      container.appendChild(cardElement);
      recalculateAllSameMaterials(name.toLowerCase());
      filterTables();
      return tableCounter;
    }

    function removeTable(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) {
        const materialKey = card.getAttribute('data-material');
        card.remove();
        recalculateAllSameMaterials(materialKey);
      }
    }

    function onMaterialNameChange(id) {
      const card = document.getElementById(`card-${id}`);
      const newName = card.querySelector('.card-title-input').value.trim().toLowerCase();
      const oldName = card.getAttribute('data-material');
      
      card.setAttribute('data-material', newName);
      recalculateAllSameMaterials(oldName);
      recalculateAllSameMaterials(newName);
    }

    // Combine calculations across identical material tables across groups
    function recalculateAllSameMaterials(materialKey) {
      if (!materialKey) return;

      const matchingCards = Array.from(document.querySelectorAll('.table-card'))
        .filter(card => card.getAttribute('data-material') === materialKey);

      if (matchingCards.length === 0) return;

      let prevLeftNeeded = 0;

      for (let rowIndex = 0; rowIndex < 4; rowIndex++) {
        let sumHave = 0;
        let sumUserInputNeeded = 0;

        matchingCards.forEach(card => {
          const rows = card.querySelectorAll('tbody tr');
          const row = rows[rowIndex];
          const haveInput = row.querySelector('.have');
          const neededInput = row.querySelector('.needed-input');

          sumHave += haveInput.value === '' ? 0 : parseFloat(haveInput.value);
          sumUserInputNeeded += neededInput.value === '' ? 0 : parseFloat(neededInput.value);
        });

        let rowTotalNeeded = 0;
        if (rowIndex === 0) {
          rowTotalNeeded = sumUserInputNeeded;
        } else {
          rowTotalNeeded = (prevLeftNeeded * 3) + sumUserInputNeeded;
        }

        const rowLeftNeeded = rowTotalNeeded - sumHave;

        matchingCards.forEach(card => {
          const rows = card.querySelectorAll('tbody tr');
          const row = rows[rowIndex];

          if (rowIndex > 0) {
            row.querySelector('.needed-total').textContent = rowTotalNeeded;
          }
          row.querySelector('.left-needed').textContent = rowLeftNeeded;
        });

        prevLeftNeeded = rowLeftNeeded;
      }
    }

    // Modal & Group Management
    function openAddGroupModal() {
      const groupName = prompt("Enter new Group Name (e.g. Mondstadt Talents, Weapons):");
      if (groupName && groupName.trim()) {
        registeredGroups.add(groupName.trim());
        renderGroupTabs();
      }
    }

    function openAddTableModal() {
      const select = document.getElementById('modalGroupSelect');
      select.innerHTML = '';
      registeredGroups.forEach(group => {
        const opt = document.createElement('option');
        opt.value = group;
        opt.textContent = group;
        select.appendChild(opt);
      });

      document.getElementById('addTableModal').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function confirmAddTable() {
      const group = document.getElementById('modalGroupSelect').value;
      const material = document.getElementById('modalMaterialInput').value.trim();
      addTable(material || "New Material", group);
      document.getElementById('modalMaterialInput').value = '';
      closeModal('addTableModal');
    }

    function renderGroupTabs() {
      const container = document.getElementById('groupTabsContainer');
      container.innerHTML = `<button class="group-tab ${activeGroupTab === 'ALL' ? 'active' : ''}" onclick="switchGroupTab('ALL')">All Materials</button>`;
      
      registeredGroups.forEach(group => {
        const btn = document.createElement('button');
        btn.className = `group-tab ${activeGroupTab === group ? 'active' : ''}`;
        btn.textContent = group;
        btn.onclick = () => switchGroupTab(group);
        container.appendChild(btn);
      });
    }

    function switchGroupTab(groupName) {
      activeGroupTab = groupName;
      renderGroupTabs();
      filterTables();
    }

    function filterTables() {
      const filterText = document.getElementById('materialFilterInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.table-card');

      cards.forEach(card => {
        const material = card.getAttribute('data-material');
        const group = card.getAttribute('data-group');

        const matchesGroup = (activeGroupTab === 'ALL' || group === activeGroupTab);
        const matchesText = (filterText === '' || material.includes(filterText));

        if (matchesGroup && matchesText) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    // Cloud Persistence Logic
    async function getMasterRecord() {
      try {
        const res = await fetch(`${BASE_URL}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        if (res.ok) {
          const json = await res.json();
          return json.record && typeof json.record === 'object' ? json.record : { profiles: {} };
        }
      } catch (err) { console.error(err); }
      return { profiles: {} };
    }

    async function saveToCloud() {
      const statusEl = document.getElementById('syncStatus');
      const profileId = document.getElementById('profileIdInput').value.trim();

      if (!profileId) { alert("Enter Profile ID."); return; }

      localStorage.setItem('resource_tracker_last_profile', profileId);
      statusEl.textContent = 'Saving...';

      const cards = document.querySelectorAll('.table-card');
      const tablesPayload = [];

      cards.forEach(card => {
        const title = card.querySelector('.card-title-input').value;
        const group = card.getAttribute('data-group');
        const rowsData = [];
        
        card.querySelectorAll('tbody tr').forEach(row => {
          rowsData.push({
            have: row.querySelector('.have').value,
            needed: row.querySelector('.needed-input').value
          });
        });

        tablesPayload.push({ title, group, rows: rowsData });
      });

      const masterData = await getMasterRecord();
      if (!masterData.profiles) masterData.profiles = {};
      masterData.profiles[profileId] = {
        groups: Array.from(registeredGroups),
        tables: tablesPayload
      };

      try {
        const res = await fetch(BASE_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(masterData)
        });

        if (res.ok) {
          statusEl.textContent = `Saved (${profileId})`;
          setTimeout(() => statusEl.textContent = 'Ready', 3000);
        }
      } catch (err) { statusEl.textContent = 'Save failed.'; }
    }

    async function loadProfile(profileId) {
      const statusEl = document.getElementById('syncStatus');
      statusEl.textContent = `Loading...`;

      localStorage.setItem('resource_tracker_last_profile', profileId);

      const masterData = await getMasterRecord();
      const profileData = masterData.profiles ? masterData.profiles[profileId] : null;

      document.getElementById('tablesContainer').innerHTML = '';
      tableCounter = 0;
      registeredGroups = new Set(["General"]);

      if (profileData) {
        if (profileData.groups) profileData.groups.forEach(g => registeredGroups.add(g));
        renderGroupTabs();

        const tablesData = profileData.tables || [];
        tablesData.forEach(data => {
          const newId = addTable(data.title, data.group || "General");
          const card = document.getElementById(`card-${newId}`);
          const rows = card.querySelectorAll('tbody tr');

          data.rows.forEach((rowData, idx) => {
            if (rows[idx]) {
              rows[idx].querySelector('.have').value = rowData.have;
              rows[idx].querySelector('.needed-input').value = rowData.needed;
            }
          });
        });

        // Trigger aggregated calculations
        const processedMaterials = new Set();
        tablesData.forEach(data => {
          const key = data.title.toLowerCase();
          if (!processedMaterials.has(key)) {
            recalculateAllSameMaterials(key);
            processedMaterials.add(key);
          }
        });

        statusEl.textContent = `Loaded (${profileId})`;
      } else {
        renderGroupTabs();
        statusEl.textContent = `New Profile (${profileId})`;
      }
    }

    function loadActiveProfile() {
      const currentId = document.getElementById('profileIdInput').value.trim();
      if (currentId) loadProfile(currentId);
    }

    function initApp() {
      const cachedProfile = localStorage.getItem('resource_tracker_last_profile');
      if (cachedProfile) {
        document.getElementById('profileIdInput').value = cachedProfile;
        loadProfile(cachedProfile);
      }
    }

    initApp();
  </script>
</body>
</html>
