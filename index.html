<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resource Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    input[type="number"] {
      width: 80%;
      padding: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Resource Tracking Table</h2>

  <table>
    <thead>
      <tr>
        <th>Amount Have</th>
        <th>Amount Needed</th>
        <th>Amount Left Needed</th>
      </tr>
    </thead>
    <tbody>
      <!-- Row 1 -->
      <tr>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td class="left-needed">0</td>
      </tr>
      <!-- Row 2 -->
      <tr>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td class="left-needed">0</td>
      </tr>
      <!-- Row 3 -->
      <tr>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td class="left-needed">0</td>
      </tr>
      <!-- Row 4 -->
      <tr>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td><input type="number" value="0" oninput="calculate()"></td>
        <td class="left-needed">0</td>
      </tr>
    </tbody>
  </table>

  <script>
    function calculate() {
      const rows = document.querySelectorAll('tbody tr');
      let previousLeftNeeded = 0;

      rows.forEach((row, index) => {
        const inputs = row.querySelectorAll('input');
        const amountHaveInput = inputs[0];
        const amountNeededInput = inputs[1];
        const leftNeededCell = row.querySelector('.left-needed');

        const amountHave = parseFloat(amountHaveInput.value) || 0;

        if (index > 0) {
          // Row 2 to 4: Amount Needed = ((Left Needed Prev Row - Amount Have) * 3) + User Input
          const userInputNeeded = parseFloat(amountNeededInput.value) || 0;
          const calculatedNeeded = ((previousLeftNeeded - amountHave) * 3) + userInputNeeded;
          
          // Display the calculated result, while keeping the input field editable
          amountNeededInput.dataset.calculated = calculatedNeeded;
          var currentAmountNeeded = calculatedNeeded;
        } else {
          // Row 1: Direct user input
          var currentAmountNeeded = parseFloat(amountNeededInput.value) || 0;
        }

        // Left Needed = Amount Needed - Amount Have
        const leftNeeded = currentAmountNeeded - amountHave;
        leftNeededCell.textContent = leftNeeded;

        // Update previous value for the next iteration
        previousLeftNeeded = leftNeeded;
      });
    }

    // Initial calculation on page load
    calculate();
  </script>

</body>
</html>
