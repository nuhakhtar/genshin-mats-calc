<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resource Tracker with Correct Logic</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 950px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    input[type="number"] {
      width: 70px;
      padding: 4px;
      text-align: center;
    }
    .debug {
      font-family: monospace;
      font-size: 0.85em;
      color: #444;
      text-align: left;
      background-color: #f9f9f9;
      white-space: pre-wrap;
    }
    .total-needed {
      font-weight: bold;
      color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Resource Tracking Table</h2>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">1st Col: Amount Have</th>
        <th style="width: 25%;">2nd Col: Amount Needed</th>
        <th style="width: 15%;">3rd Col: Amount Left Needed</th>
        <th style="width: 45%;">Calculation Logic (Debug)</th>
      </tr>
    </thead>
    <tbody>
      <!-- Row 1 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td><input type="number" value="0" class="needed-input" oninput="calculate()"></td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
      <!-- Row 2 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td>
          <span class="total-needed">0</span>
          <br><small>(+ User Input: <input type="number" value="0" class="needed-input" oninput="calculate()">)</small>
        </td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
      <!-- Row 3 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td>
          <span class="total-needed">0</span>
          <br><small>(+ User Input: <input type="number" value="0" class="needed-input" oninput="calculate()">)</small>
        </td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
      <!-- Row 4 -->
      <tr>
        <td><input type="number" value="0" class="have" oninput="calculate()"></td>
        <td>
          <span class="total-needed">0</span>
          <br><small>(+ User Input: <input type="number" value="0" class="needed-input" oninput="calculate()">)</small>
        </td>
        <td class="left-needed">0</td>
        <td class="debug"></td>
      </tr>
    </tbody>
  </table>

  <script>
    function calculate() {
      const rows = document.querySelectorAll('tbody tr');
      let prevLeftNeeded = 0;

      rows.forEach((row, index) => {
        const haveInput = row.querySelector('.have');
        const neededInput = row.querySelector('.needed-input');
        const leftNeededCell = row.querySelector('.left-needed');
        const debugCell = row.querySelector('.debug');

        // Parse inputs cleanly without default numbers (supports negative numbers)
        const amountHave = haveInput.value === '' ? 0 : parseFloat(haveInput.value);
        const userInput = neededInput.value === '' ? 0 : parseFloat(neededInput.value);

        let totalAmountNeeded = 0;
        let debugText = "";

        if (index === 0) {
          // Row 1: Amount Needed is strictly User Input
          totalAmountNeeded = userInput;
          debugText = `Row 1 Needed = User Input (${userInput})`;
        } else {
          // Rows 2-4: Formula = (Amount Left from prev row * 3) + User Input
          totalAmountNeeded = (prevLeftNeeded * 3) + userInput;

          // Update total display in 2nd column
          row.querySelector('.total-needed').textContent = totalAmountNeeded;

          debugText = `Needed = (${prevLeftNeeded} * 3) + (${userInput}) = ${totalAmountNeeded}`;
        }

        // 3rd Column: Amount Left Needed = 2nd Column - 1st Column
        const leftNeeded = totalAmountNeeded - amountHave;
        leftNeededCell.textContent = leftNeeded;

        debugText += `\nLeft Needed = ${totalAmountNeeded} - (${amountHave}) = ${leftNeeded}`;
        
        // Render step-by-step logic in debug column
        debugCell.textContent = debugText;

        // Pass exact leftNeeded value down to the next row
        prevLeftNeeded = leftNeeded;
      });
    }

    // Run initial calculation with 0 defaults
    calculate();
  </script>

</body>
</html>
