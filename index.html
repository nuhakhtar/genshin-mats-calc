<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teyvat Resource Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --genshin-bg: #121824;
      --card-bg: rgba(26, 34, 48, 0.85);
      --card-border: #3d4a5d;
      --gold-primary: #e3b342;
      --gold-glow: rgba(227, 179, 66, 0.3);
      --cyan-accent: #37d6d6;
      --text-main: #ece5d8;
      --text-muted: #9aa8b9;
      --input-bg: rgba(15, 20, 29, 0.6);
      --input-border: #2d3848;
      --radius: 6px;
      --font-title: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--genshin-bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(55, 214, 214, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 100%, rgba(227, 179, 66, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar Header */
    .dashboard-header {
      max-width: 1920px;
      margin: 0 auto 32px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(227, 179, 66, 0.2);
    }

    .title-area h1 {
      font-family: var(--font-title);
      font-size: 1.75rem;
      letter-spacing: 0.05em;
      color: var(--gold-primary);
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .title-area p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Genshin Styled Button */
    .btn-genshin {
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--genshin-bg);
      background: linear-gradient(135deg, #f7d479 0%, #e3b342 100%);
      border: 1px solid #ffe89e;
      border-radius: 20px;
      padding: 10px 24px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--gold-glow);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .btn-genshin:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(227, 179, 66, 0.6);
    }

    /* Grid Layout: Up to 5 tables per row */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(320px, 1fr));
      gap: 20px;
      max-width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 1800px) {
      .tables-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 1400px) {
      .tables-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 1050px) {
      .tables-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      .tables-grid { grid-template-columns: 1fr; }
    }

    /* Genshin Card Styling */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .table-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    /* Card Header & Custom Naming */
    .card-header {
      padding: 14px 16px;
      background: rgba(15, 20, 29, 0.4);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-input {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold-primary);
      background: transparent;
      border: none;
      border-bottom: 1px dashed transparent;
      outline: none;
      width: 80%;
      transition: border-color 0.2s;
    }

    .card-title-input:focus, .card-title-input:hover {
      border-bottom-color: var(--gold-primary);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: #ff5f5f;
    }

    /* Table Design */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-family: var(--font-title);
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
      background: rgba(15, 20, 29, 0.3);
      padding: 10px 8px;
      border-bottom: 1px solid var(--card-border);
      text-align: center;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(61, 74, 93, 0.4);
      text-align: center;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Inputs & Form Elements */
    input[type="number"] {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-main);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      padding: 5px;
      width: 60px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="number"]:focus {
      border-color: var(--cyan-accent);
      box-shadow: 0 0 8px rgba(55, 214, 214, 0.25);
    }

    .needed-cell-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .needed-total {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .sub-input {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sub-input input {
      width: 45px;
      padding: 2px 4px;
      font-size: 0.75rem;
    }

    /* Dynamic Left Needed Badge */
    .left-needed {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--cyan-accent);
      background: rgba(55, 214, 214, 0.1);
      border: 1px solid rgba(55, 214, 214, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      min-width: 40px;
    }

    /* Genshin Debug Console Style */
    .debug-box {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      line-height: 1.35;
      color: var(--text-muted);
      background: rgba(10, 14, 22, 0.6);
      border: 1px solid rgba(61, 74, 93, 0.3);
      border-radius: 4px;
      padding: 6px;
      text-align: left;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div class="title-area">
      <h1>Resource Optimization Matrix</h1>
      <p>Multi-Domain Material & Talent Progression Planner</p>
    </div>
    <button class="btn-genshin" onclick="addTable()">+ Add New Matrix</button>
  </div>

  <div class="tables-grid" id="tablesContainer">
    <!-- Dynamic tables will spawn here -->
  </div>

  <script>
    let tableCounter = 0;

    function createTableHTML(id, defaultName) {
      return `
        <div class="table-card" id="card-${id}">
          <div class="card-header">
            <input type="text" class="card-title-input" value="${defaultName}" placeholder="Domain Name...">
            <button class="btn-delete" title="Remove Matrix" onclick="removeTable(${id})">✕</button>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width: 20%;">Have</th>
                <th style="width: 25%;">Needed</th>
                <th style="width: 20%;">Left</th>
                <th style="width: 35%;">Debug Logic</th>
              </tr>
            </thead>
            <tbody>
              ${[1, 2, 3, 4].map((row, idx) => `
                <tr>
                  <td>
                    <input type="number" value="0" class="have" oninput="calculateCard(${id})">
                  </td>
                  <td>
                    <div class="needed-cell-wrapper">
                      ${idx === 0 
                        ? `<input type="number" value="0" class="needed-input" oninput="calculateCard(${id})">`
                        : `<span class="needed-total">0</span>
                           <div class="sub-input">
                             <span>+</span>
                             <input type="number" value="0" class="needed-input" oninput="calculateCard(${id})">
                           </div>`
                      }
                    </div>
                  </td>
                  <td>
                    <span class="left-needed">0</span>
                  </td>
                  <td>
                    <div class="debug-box debug"></div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function addTable(customName) {
      tableCounter++;
      const name = customName || `Resource Matrix #${tableCounter}`;
      const container = document.getElementById('tablesContainer');
      
      const wrapper = document.createElement('div');
      wrapper.innerHTML = createTableHTML(tableCounter, name);
      const cardElement = wrapper.firstElementChild;
      
      container.appendChild(cardElement);
      calculateCard(tableCounter);
    }

    function removeTable(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) card.remove();
    }

    function calculateCard(id) {
      const card = document.getElementById(`card-${id}`);
      if (!card) return;

      const rows = card.querySelectorAll('tbody tr');
      let prevLeftNeeded = 0;

      rows.forEach((row, index) => {
        const haveInput = row.querySelector('.have');
        const neededInput = row.querySelector('.needed-input');
        const leftNeededCell = row.querySelector('.left-needed');
        const debugCell = row.querySelector('.debug');

        const amountHave = haveInput.value === '' ? 0 : parseFloat(haveInput.value);
        const userInput = neededInput.value === '' ? 0 : parseFloat(neededInput.value);

        let totalAmountNeeded = 0;
        let debugText = "";

        if (index === 0) {
          totalAmountNeeded = userInput;
          debugText = `Needed = User Input (${userInput})`;
        } else {
          totalAmountNeeded = (prevLeftNeeded * 3) + userInput;
          row.querySelector('.needed-total').textContent = totalAmountNeeded;
          debugText = `Needed = (${prevLeftNeeded} × 3) + (${userInput}) = ${totalAmountNeeded}`;
        }

        const leftNeeded = totalAmountNeeded - amountHave;
        leftNeededCell.textContent = leftNeeded;

        debugText += `\nLeft = ${totalAmountNeeded} - (${amountHave}) = ${leftNeeded}`;
        debugCell.textContent = debugText;

        prevLeftNeeded = leftNeeded;
      });
    }

    // Initialize with two named tables on load
    addTable("Character Talents");
    addTable("Weapon Ascension");
  </script>

</body>
</html>
